<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Blog - Maîtresse Nelly</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f0f0;
        }

        .gradient-text {
            background: linear-gradient(45deg, #ff00d4, #00b3ff);
            -webkit-background-clip: text;
            color: transparent;
        }

        .blog-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .full-article {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .full-article-content {
            background-color: white;
            margin: 5% auto;
            padding: 2rem;
            width: 90%;
            max-width: 800px;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            cursor: pointer;
            color: #ff00d4;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #00b3ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white shadow-md fixed w-full z-50">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="text-3xl font-bold flex items-center space-x-2 gradient-text">
                    <box-icon name='heart-circle' animation='tada' color='#ff00d4'></box-icon>
                    <span>Maîtresse Nelly</span>
                </a>
                <ul class="hidden md:flex space-x-6 text-lg">
                    <li><a href="./blog.html" class="nav-link flex items-center">
                        <box-icon name='book' size="1.2rem" color="#ff00d4"></box-icon>
                        <span class="ml-1 text-black">Blog</span>
                    </a></li>
                    <li><a href="./Post.html" class="nav-link flex items-center">
                        <box-icon name='repost' size="1.2rem" color="#ff00d4"></box-icon>
                        <span class="ml-1 text-black">Post</span>
                    </a></li>
                    <li><a href="./Contact.html" class="nav-link flex items-center">
                        <box-icon name='envelope' size="1.2rem" color="#ff00d4"></box-icon>
                        <span class="ml-1 text-black">Contact</span>
                    </a></li>
                </ul>
                <button class="md:hidden focus:outline-none" id="menu-toggle">
                    <box-icon name='menu' color='#ff00d4'></box-icon>
                </button>
            </div>
            <div class="md:hidden">
                <ul class="mobile-menu hidden mt-3 space-y-2 px-4 pb-4">
                    <li><a href="./blog.html" class="block py-2 px-4 text-sm text-white hover:bg-fuchsia-600 hover:text-white rounded transition-colors duration-300">Blog</a></li>
                    <li><a href="post.html" class="block py-2 px-4 text-sm text-white hover:bg-fuchsia-600 hover:text-white rounded transition-colors duration-300">Post</a></li>
                    <li><a href="contact.html" class="block py-2 px-4 text-sm text-white hover:bg-fuchsia-600 hover:text-white rounded transition-colors duration-300">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-6 py-20 mt-12">
        <h1 class="text-4xl font-bold mb-8 text-center gradient-text">Les articles du Blog</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="blogContainer"></div>
    </main>

    <div id="fullArticle" class="full-article">
        <div class="full-article-content">
            <span class="close-btn">&times;</span>
            <h2 id="fullArticleTitle" class="text-3xl font-bold mb-4"></h2>
            <img id="fullArticleImage" src="" alt="" class="rounded-lg shadow-md mb-4">
            <div id="fullArticleDescriptions" class="mb-4"></div>
            <div id="description2Container" class="text-gray-700"></div>
            <div class="full-article-meta flex justify-between text-sm text-gray-500 mt-4">
                <span id="fullArticleCategory" class="flex items-center text-blue-600"></span>
                <span id="fullArticleAuthor" class="flex items-center text-yellow-600"></span>
                <span id="fullArticleDate" class="flex items-center text-red-600"></span>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2024 Maîtresse Nelly. Tous droits réservés.</p>
            <a href="metionlegale.html" class="text-blue-400 hover:text-blue-600">Mentions légales</a>
        </div>
    </footer>

    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script>
        const blogPosts = [
          
            {
                title: "Bilan de mon année 2024",
                image: "./images/45.png",
                description: "Découvrez mon bilan annuel et les moments marquants.",
                description2: `
                    Retrouvez l'article ici --> 
                    <a href="https://www.dropbox.com/scl/fi/0ra97tx7h0r6davevwp5z/Bilan-de-mon-ann-e-2024.pdf?rlkey=sfl0pio9kwzn0smsgorgygdtu&st=kq5s6b0x&dl=0" 
                       target="_blank" 
                       class="text-blue-500 hover:text-blue-700 underline">
                       Télécharger le PDF
                    </a>
                `,
                category: "Lifestyle",
                author: "QueenNelly",
                date: "2025-01-03"
            }
        ];

        function createBlogCard(post, index) {
            return `
                <div class="blog-card cursor-pointer" onclick="showFullArticle(${index})">
                    <img src="${post.image}" alt="${post.title}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h2 class="text-xl font-semibold mb-2">${post.title}</h2>
                        <p class="text-gray-600 text-sm mb-4">${post.description}</p>
                        <div class="flex justify-between text-sm text-gray-500">
                            <span class="flex items-center text-blue-600"><i class='bx bx-purchase-tag mr-1'></i>${post.category}</span>
                            <span class="flex items-center text-yellow-600"><i class='bx bx-user mr-1'></i>${post.author}</span>
                            <span class="flex items-center text-red-600"><i class='bx bx-calendar mr-1'></i>${post.date}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBlogPosts() {
            const blogContainer = document.getElementById('blogContainer');
            blogContainer.innerHTML = blogPosts.map(createBlogCard).join('');
        }

        function showFullArticle(index) {
            const post = blogPosts[index];
            document.getElementById('fullArticleTitle').textContent = post.title;
            document.getElementById('fullArticleImage').src = post.image;
            document.getElementById('fullArticleDescriptions').innerHTML = post.description;
            document.getElementById("description2Container").innerHTML = post.description2;
            document.getElementById('fullArticleCategory').innerHTML = `<i class='bx bx-purchase-tag mr-1'></i>${post.category}`;
            document.getElementById('fullArticleAuthor').innerHTML = `<i class='bx bx-user mr-1'></i>${post.author}`;
            document.getElementById('fullArticleDate').innerHTML = `<i class='bx bx-calendar mr-1'></i>${post.date}`;
            document.getElementById('fullArticle').style.display = 'block';
        }

        document.querySelector('.close-btn').addEventListener('click', function () {
            document.getElementById('fullArticle').style.display = 'none';
        });

        renderBlogPosts();
    </script>
</body>
</html>
